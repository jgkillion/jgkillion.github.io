<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla sign-in done</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;padding:24px;max-width:560px;margin:auto}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;font-size:15px}button{margin-top:14px;padding:12px 18px;font-size:16px;border-radius:8px;border:0;background:#3e6ae1;color:#fff}</style></head>
<body><h2>Tesla sign-in done</h2><p id="m">Copy this code and paste it into the box in Grok Bot. It expires in a few minutes.</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copied'">Copy code</button>
<script>var p=new URLSearchParams(location.search);var c=p.get('code');if(c){document.getElementById('c').textContent=c}else{document.getElementById('m').textContent='No code found: '+(p.get('error_description')||p.get('error')||'try signing in again');document.querySelector('button').style.display='none';document.getElementById('c').style.display='none'}</script>
</body></html>
